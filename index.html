<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#111">
  <title>QLab Remote</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: #111; color: #eee;
      font-family: -apple-system, system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
    body { display: flex; flex-direction: column; padding: 16px;
      padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: max(16px, env(safe-area-inset-bottom)); gap: 16px; }
    header { display: flex; justify-content: space-between; align-items: center; }
    h1 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #888; }
    #conn { font-size: 12px; color: #888; display: flex; align-items: center; gap: 6px; }
    #conn::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #b3261e; }
    #conn.on::before { background: #2fbf5a; }
    #cues { flex: 1; display: flex; flex-direction: column; gap: 16px; }
    button { flex: 1; border: 0; border-radius: 20px; background: #1f7a3a; color: #fff;
      font-size: 22px; font-weight: 700; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 4px; touch-action: manipulation;
      transition: transform .08s, background .15s; }
    button .num { font-size: 64px; line-height: 1; }
    .cue { position: relative; overflow: hidden; }
    .cue .name { font-size: 15px; font-weight: 500; opacity: .85; max-width: 90%;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cue .info { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; opacity: .9; min-height: 1.2em; }
    .cue .state { display: inline-block; padding: 2px 8px; border-radius: 6px; margin-right: 6px;
      font-size: 11px; letter-spacing: .08em; background: rgba(0,0,0,.25); }
    .cue.running .state { background: #fff; color: #1f7a3a; }
    .cue.paused .state { background: #f2b705; color: #111; }
    .cue .bar { position: absolute; left: 0; bottom: 0; height: 6px; width: 0; background: rgba(255,255,255,.85); }
    .cue.running { box-shadow: inset 0 0 0 3px #fff; }
    button:active { transform: scale(.97); background: #2a9a4c; }
    button.ok { background: #2fbf5a; }
    button.err { background: #b3261e; }
    .stops { flex: 0 0 96px; display: flex; gap: 16px; }
    #fade { background: #6b4a12; font-size: 28px; letter-spacing: .1em; }
    #fade small { font-size: 12px; font-weight: 500; letter-spacing: 0; opacity: .7; }
    #fade:active { background: #8a6018; }
    #fade.ok { background: #d9a020; }
    #stop { background: #5a1a17; font-size: 28px; letter-spacing: .1em; }
    #stop small { font-size: 12px; font-weight: 500; letter-spacing: 0; opacity: .7; }
    #stop:active { background: #7a2420; }
    #stop.armed, #fade.armed { background: #d9342b; }
    button.pending { animation: pending .6s ease-in-out infinite alternate; }
    @keyframes pending { to { opacity: .55; } }
    #banner { background: #b3261e; color: #fff; border-radius: 14px; padding: 12px 16px; text-align: center;
      display: flex; flex-direction: column; gap: 2px; }
    #banner[hidden] { display: none; }
    #banner strong { font-size: 18px; letter-spacing: .06em; }
    #banner span { font-size: 13px; opacity: .9; }
    body:not([data-connection="ok"]) .cue:not(.err),
    body:not([data-connection="ok"]) .stops button:not(.err) { filter: grayscale(1); opacity: .4; }
    body[data-connection="server"] #spotify { opacity: .4; }
    #spotify { background: #1a1a1a; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
    #spotify .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    #spotify .label { font-size: 11px; font-weight: 700; letter-spacing: .1em; color: #1db954; }
    #spotify .time { font-size: 12px; color: #888; font-variant-numeric: tabular-nums; }
    #spotify .track { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #spotify .artist { font-size: 13px; color: #aaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: -6px; }
    #spotify .progress { height: 4px; background: #333; border-radius: 2px; overflow: hidden; }
    #spotify .progress div { height: 100%; width: 0; background: #1db954; }
    #spotify .controls { display: flex; gap: 10px; }
    #spotify .controls button { flex: 1; height: 56px; border-radius: 14px; background: #2a2a2a; font-size: 24px; }
    #spotify .controls button:active { background: #3a3a3a; }
    #spotify .controls .pp { background: #1db954; color: #111; }
    #spotify .controls .pp:active { background: #23d160; }
    #spotify .vol { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #888; }
    #spotify input[type=range] { flex: 1; accent-color: #1db954; height: 28px; }
    #spotify.off .controls, #spotify.off .vol, #spotify.off .progress { opacity: .35; }
    @media (max-height: 740px) {
      button .num { font-size: 44px; }
      .stops { flex-basis: 72px; }
    }
    #status { text-align: center; font-size: 14px; color: #888; min-height: 1.2em; }
  </style>
</head>
<body>
  <header><h1>QLab Remote</h1><span id="conn">QLab</span></header>
  <div id="banner" role="alert" hidden><strong></strong><span></span></div>
  <div id="cues"></div>
  <div class="stops">
    <button id="fade"><span>FADE</span><small>2 s</small></button>
    <button id="stop"><span>STOP</span><small>tuplanapautus</small></button>
  </div>
  <section id="spotify" class="off">
    <div class="top"><span class="label">SPOTIFY</span><span class="time"></span></div>
    <div class="track">Spotify ei ole käynnissä</div>
    <div class="artist"></div>
    <div class="progress"><div></div></div>
    <div class="controls">
      <button data-cmd="previous" aria-label="Edellinen">⏮</button>
      <button data-cmd="playpause" class="pp" aria-label="Toista/tauko">▶</button>
      <button data-cmd="next" aria-label="Seuraava">⏭</button>
    </div>
    <label class="vol">🔈<input type="range" min="0" max="100" step="1" aria-label="Äänenvoimakkuus"><span class="volnum"></span></label>
  </section>
  <div id="status"></div>
  <script>
    const statusEl = document.getElementById('status');
    const cuesEl = document.getElementById('cues');
    const bannerEl = document.getElementById('banner');
    const connEl = document.getElementById('conn');
    const fadeBtn = document.getElementById('fade');
    const stopBtn = document.getElementById('stop');
    const cueButtons = {};

    const now = () => new Date().toLocaleTimeString('fi-FI');

    function fmt(sec) {
      sec = Math.max(0, Math.round(sec));
      return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
    }

    // Sends a QLab command. The server only answers once QLab has confirmed it, so the button
    // stays in a "pending" state until then and turns green (ok) or red (error).
    async function qlabCommand(url, btn, label, vibration) {
      if (btn.classList.contains('pending')) return;
      btn.classList.remove('ok', 'err');
      btn.classList.add('pending');
      try {
        const res = await fetch(url, { method: 'POST' });
        if (!res.ok) throw new Error(await res.text() || res.statusText);
        btn.classList.add('ok');
        statusEl.textContent = label + ' – ' + now();
        if (navigator.vibrate) navigator.vibrate(vibration);
      } catch (e) {
        btn.classList.add('err');
        statusEl.textContent = label + ' epäonnistui: ' + (e.message === 'Failed to fetch' ? 'ei yhteyttä palvelimeen' : e.message);
        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      }
      btn.classList.remove('pending');
      setTimeout(() => btn.classList.remove('ok', 'err'), btn.classList.contains('err') ? 1500 : 400);
    }

    // Runs action only on the second tap within DOUBLE_TAP_MS, so the button can't be hit by accident.
    const DOUBLE_TAP_MS = 500;
    function doubleTap(btn, action) {
      let armTimer = null;
      btn.addEventListener('click', () => {
        if (!armTimer) {
          btn.classList.add('armed');
          armTimer = setTimeout(() => { armTimer = null; btn.classList.remove('armed'); }, DOUBLE_TAP_MS);
          return;
        }
        clearTimeout(armTimer);
        armTimer = null;
        btn.classList.remove('armed');
        action();
      });
    }

    doubleTap(stopBtn, () => qlabCommand('/stop', stopBtn, 'STOP', [30, 50, 30]));

    fetch('/config').then(r => r.json()).then(c => {
      const fade = () => qlabCommand('/fade', fadeBtn, 'FADE', 30);
      fadeBtn.querySelector('small').textContent = c.fadeSeconds + ' s' + (c.fadeConfirm ? ' · tuplanapautus' : '');
      if (c.fadeConfirm) doubleTap(fadeBtn, fade);
      else fadeBtn.addEventListener('click', fade);
    }).catch(() => {});

    const sp = document.getElementById('spotify');
    const volInput = sp.querySelector('input[type=range]');
    let volDragging = false;
    let volSending = false;
    let volPending = null;

    async function spotify(cmd) {
      try {
        const res = await fetch('/spotify/' + cmd, { method: 'POST' });
        if (!res.ok) throw new Error(await res.text());
      } catch (e) {
        statusEl.textContent = 'Virhe: ' + e.message;
      }
    }

    sp.querySelectorAll('.controls button').forEach(b => b.addEventListener('click', () => spotify(b.dataset.cmd)));

    // Send volume changes while dragging, but never more than one request in flight.
    async function sendVolume(v) {
      if (volSending) { volPending = v; return; }
      volSending = true;
      await spotify('volume/' + v);
      volSending = false;
      if (volPending !== null) { const next = volPending; volPending = null; sendVolume(next); }
    }
    volInput.addEventListener('input', () => {
      sp.querySelector('.volnum').textContent = volInput.value;
      sendVolume(volInput.value);
    });
    volInput.addEventListener('pointerdown', () => { volDragging = true; });
    volInput.addEventListener('change', () => { setTimeout(() => { volDragging = false; }, 1500); });

    function renderSpotify(s) {
      sp.classList.toggle('off', !s || !s.running);
      if (!s || !s.running) {
        sp.querySelector('.track').textContent = 'Spotify ei ole käynnissä';
        sp.querySelector('.artist').textContent = '';
        sp.querySelector('.time').textContent = '';
        sp.querySelector('.progress div').style.width = 0;
        sp.querySelector('.pp').textContent = '▶';
        return;
      }
      sp.querySelector('.track').textContent = s.name || '–';
      sp.querySelector('.artist').textContent = s.artist || '';
      sp.querySelector('.time').textContent = s.duration ? '−' + fmt(s.duration - s.position) + ' / ' + fmt(s.duration) : '';
      sp.querySelector('.progress div').style.width = s.duration ? Math.min(100, s.position / s.duration * 100) + '%' : 0;
      sp.querySelector('.pp').textContent = s.state === 'playing' ? '⏸' : '▶';
      if (!volDragging && !volSending) {
        volInput.value = s.volume;
        sp.querySelector('.volnum').textContent = s.volume;
      }
    }

    // connection: 'server' (page can't reach the server) or the server's QLab state: 'offline', 'noreply', 'ok'.
    const CONNECTION_TEXT = {
      server: ['EI YHTEYTTÄ PALVELIMEEN', 'Tarkista wifi ja että palvelin on käynnissä Macilla.'],
      offline: ['EI YHTEYTTÄ QLABIIN', 'Onko QLab käynnissä?'],
      noreply: ['QLAB EI VASTAA', 'Onko workspace auki ja OSC sallittu?'],
    };

    function renderConnection(connection) {
      document.body.dataset.connection = connection;
      const text = CONNECTION_TEXT[connection];
      bannerEl.hidden = !text;
      if (text) {
        bannerEl.querySelector('strong').textContent = text[0];
        bannerEl.querySelector('span').textContent = text[1];
      }
      connEl.classList.toggle('on', connection === 'ok');
      connEl.textContent = connection === 'ok' ? 'QLab yhdistetty' : connection === 'server' ? 'Ei yhteyttä palvelimeen' : 'Ei yhteyttä QLabiin';
    }

    function render(status) {
      renderConnection(status.qlab);
      renderSpotify(status.spotify);
      for (const [cue, btn] of Object.entries(cueButtons)) {
        const s = status.cues[cue];
        const name = btn.querySelector('.name');
        const info = btn.querySelector('.info');
        const bar = btn.querySelector('.bar');
        btn.classList.toggle('running', !!(s && s.running && !s.paused));
        btn.classList.toggle('paused', !!(s && s.paused));
        if (!s) { name.textContent = ''; info.textContent = ''; bar.style.width = 0; continue; }
        if (!s.found) { name.textContent = 'Cuea ei löydy'; info.textContent = ''; bar.style.width = 0; continue; }
        name.textContent = s.name || '';
        const label = s.paused ? 'TAUKO' : s.running ? 'SOI' : 'VALMIS';
        const active = s.running || s.paused;
        let time;
        if (!s.duration) time = active ? fmt(s.elapsed) : '–';
        else time = (active ? '−' + fmt(s.duration - s.elapsed) : fmt(s.duration)) + ' / ' + fmt(s.duration);
        info.innerHTML = '<span class="state"></span><span class="time"></span>';
        info.querySelector('.state').textContent = label;
        info.querySelector('.time').textContent = time;
        bar.style.width = active && s.duration ? Math.min(100, s.elapsed / s.duration * 100) + '%' : 0;
      }
    }

    // A status request that takes longer than this counts as a lost connection, so stale
    // cue info never stays on screen looking current.
    const STATUS_TIMEOUT_MS = 2000;

    async function poll() {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), STATUS_TIMEOUT_MS);
      try {
        const res = await fetch('/status', { cache: 'no-store', signal: ctrl.signal });
        render(await res.json());
      } catch {
        render({ qlab: 'server', cues: {}, spotify: null });
      }
      clearTimeout(timer);
      setTimeout(poll, 300);
    }

    fetch('/cues').then(r => r.json()).then(cues => {
      for (const cue of cues) {
        const btn = document.createElement('button');
        btn.className = 'cue';
        btn.innerHTML = '<span>GO</span><span class="num"></span><span class="name"></span><span class="info"></span><span class="bar"></span>';
        btn.querySelector('.num').textContent = cue;
        btn.addEventListener('click', () => qlabCommand('/go/' + encodeURIComponent(cue), btn, 'GO cue ' + cue, 30));
        cuesEl.appendChild(btn);
        cueButtons[cue] = btn;
      }
      poll();
    }).catch(() => renderConnection('server'));
  </script>
</body>
</html>
