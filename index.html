<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="QLab">
  <meta name="theme-color" content="#111">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="icon" type="image/png" href="/icon-192.png">
  <title>QLab Remote</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: #111; color: #eee;
      font-family: -apple-system, system-ui, sans-serif; user-select: none; -webkit-user-select: none;
      -webkit-touch-callout: none; }
    body { display: flex; flex-direction: column; padding: 16px;
      padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: max(16px, env(safe-area-inset-bottom)); gap: 16px; }
    header { display: flex; justify-content: space-between; align-items: center; }
    h1 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #888; }
    #conn { font-size: 12px; color: #888; display: flex; align-items: center; gap: 6px; }
    #conn::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #b3261e; }
    #conn.on::before { background: #2fbf5a; }
    [hidden] { display: none !important; }

    button { flex: 1; border: 0; border-radius: 20px; background: #1f7a3a; color: #fff;
      font-size: 22px; font-weight: 700; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 4px; touch-action: manipulation;
      transition: transform .08s, background .15s, filter .15s; font-family: inherit; }
    button:active { transform: scale(.97); filter: brightness(1.2); }
    button.ok { background: #2fbf5a; }
    button.err { background: #b3261e; }
    button.pending { animation: pending .6s ease-in-out infinite alternate; }
    @keyframes pending { to { opacity: .55; } }

    #cues { flex: 1; display: flex; flex-direction: column; gap: 16px; min-height: 0; }
    /* Cue card: number chip and title on the first row, time below. The whole card is the GO button. */
    .cue { position: relative; overflow: hidden; background: var(--bg, #1f7a3a); min-height: 0;
      align-items: stretch; justify-content: center; gap: 4px; padding: 12px 16px 14px; text-align: left; }
    .cue .top { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .cue .chip { flex: none; font-size: 13px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: rgba(0,0,0,.25); }
    .cue .title { flex: 1; min-width: 0; font-size: 28px; font-weight: 800; line-height: 1.15;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cue .flag { flex: none; font-size: 15px; opacity: .85; }
    .cue .meta { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; min-height: 24px; opacity: .75;
      display: flex; align-items: baseline; gap: 4px; }
    .cue .meta b { font-size: 20px; font-weight: 800; }
    .cue .meta .warn { color: #ffd2cc; }
    .cue.running .meta, .cue.paused .meta { opacity: 1; }
    .cue.paused .meta b { color: #f2b705; }
    .cue .bar { position: absolute; left: 0; bottom: 0; height: 6px; width: 0; background: rgba(255,255,255,.85); }
    .cue.running { box-shadow: inset 0 0 0 3px #fff; }
    .cue.paused { box-shadow: inset 0 0 0 3px #f2b705; }

    #playhead { background: #1a1a1a; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
    #playhead.solo { flex: 1; }
    #playhead .ph-info { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
    #playhead .ph-label { font-size: 11px; font-weight: 700; letter-spacing: .1em; color: #888; flex: none; }
    #playhead .ph-num { font-size: 22px; font-weight: 800; flex: none; }
    #playhead .ph-name { font-size: 16px; color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #playhead .ph-controls { display: flex; gap: 10px; flex: 1; min-height: 72px; }
    #playhead .ph-controls button { background: #2a2a2a; font-size: 24px; flex: 0 0 72px; }
    #playhead .ph-controls .ph-go { flex: 1; background: #1f7a3a; font-size: 34px; letter-spacing: .1em; }
    #playhead.empty .ph-go { opacity: .4; }

    .stops { flex: 0 0 96px; display: flex; gap: 16px; }
    .stops small { font-size: 12px; font-weight: 500; letter-spacing: 0; opacity: .7; }
    #fade { background: #6b4a12; font-size: 28px; letter-spacing: .1em; }
    #fade.ok { background: #d9a020; }
    #stop { background: #5a1a17; font-size: 28px; letter-spacing: .1em; }
    #stop.armed, #fade.armed { background: #d9342b; }

    #banner { background: #b3261e; color: #fff; border-radius: 14px; padding: 12px 16px; text-align: center;
      display: flex; flex-direction: column; gap: 2px; }
    #banner strong { font-size: 18px; letter-spacing: .06em; }
    #banner span { font-size: 13px; opacity: .9; }
    body:not([data-connection="ok"]) .cue:not(.err),
    body:not([data-connection="ok"]) #playhead,
    body:not([data-connection="ok"]) .stops button:not(.err) { filter: grayscale(1); opacity: .4; }
    body[data-connection="server"] #spotify { opacity: .4; }

    #spotify { background: #1a1a1a; border-radius: 20px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
    #spotify .top { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
    #spotify .label { flex: none; font-size: 15px; font-weight: 700; color: #1db954; }
    #spotify .time { flex: none; font-size: 12px; color: #888; font-variant-numeric: tabular-nums; }
    #spotify .track { flex: 1; min-width: 0; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #spotify .artist { font-size: 13px; color: #aaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: -6px 0 0 23px; }
    #spotify .artist:empty { display: none; }
    #spotify .progress { height: 4px; background: #333; border-radius: 2px; overflow: hidden; }
    #spotify .progress div { height: 100%; width: 0; background: #1db954; }
    #spotify .controls { display: flex; gap: 10px; }
    #spotify .controls button { flex: 1; height: 48px; border-radius: 12px; background: #2a2a2a; font-size: 22px; }
    #spotify .controls .pp { background: #1db954; color: #111; }
    #spotify .vol { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #888; }
    #spotify input[type=range] { flex: 1; accent-color: #1db954; height: 28px; }
    #spotify.off .controls, #spotify.off .vol, #spotify.off .progress { opacity: .35; }

    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; z-index: 10; }
    #sheet { align-items: flex-end; }
    #sheet .panel { width: 100%; background: #1c1c1c; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; gap: 10px;
      padding: 18px 16px; padding-bottom: max(18px, env(safe-area-inset-bottom)); }
    #sheet h2 { margin: 0 0 4px; font-size: 15px; color: #aaa; font-weight: 600; text-align: center;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #sheet button { flex: none; height: 60px; border-radius: 14px; font-size: 18px; }
    #sheet [data-act="pause"] { background: #8a6b0a; }
    #sheet [data-act="fade"] { background: #6b4a12; }
    #sheet [data-act="stop"] { background: #5a1a17; }
    #sheet .cancel { background: #2a2a2a; }
    #login { align-items: center; justify-content: center; background: #111; }
    #login form { display: flex; flex-direction: column; gap: 12px; width: min(320px, 100%); padding: 16px; }
    #login h2 { margin: 0; font-size: 18px; text-align: center; }
    #login input { font-size: 28px; text-align: center; letter-spacing: .3em; padding: 14px; border-radius: 14px;
      border: 1px solid #333; background: #1a1a1a; color: #fff; user-select: text; -webkit-user-select: text; }
    #login button { flex: none; height: 60px; font-size: 18px; }
    #login .err { color: #ff6b61; text-align: center; min-height: 1.2em; font-size: 14px; }

    @media (max-height: 740px) {
      .cue .title { font-size: 26px; }
      .stops { flex-basis: 72px; }
    }
    #status { text-align: center; font-size: 14px; color: #888; min-height: 1.2em; }

    header .right { display: flex; align-items: center; gap: 12px; }
    #edit-open { flex: none; width: 36px; height: 36px; border-radius: 10px; background: #222; font-size: 18px; color: #aaa; }
    #main, #side { display: flex; flex-direction: column; gap: 16px; min-height: 0; }
    #main { flex: 1; }
    /* Many cues: keep buttons tappable and let the list scroll instead of squashing them. */
    .cue { flex: 1 0 88px; }
    #cues { overflow-y: auto; }

    /* Tablet / landscape: cues on the left, stop buttons and Spotify on the right. */
    @media (min-width: 700px) and (orientation: landscape), (min-width: 1000px) {
      body { display: grid; grid-template-columns: minmax(0, 1fr) clamp(260px, 36%, 380px);
        grid-template-rows: auto auto minmax(0, 1fr) auto; column-gap: 16px; height: 100%; }
      header, #banner, #status { grid-column: 1 / -1; }
      header { grid-row: 1; }
      #banner { grid-row: 2; }
      #status { grid-row: 4; }
      #main { grid-column: 1; grid-row: 3; }
      #side { grid-column: 2; grid-row: 3; overflow-y: auto; }
      #cues { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); grid-auto-rows: minmax(88px, 1fr); }
      .stops { flex-basis: 110px; }
    }
    @media (min-width: 1000px) {
      #cues { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
      .cue .title { font-size: 34px; }
      .cue .meta b { font-size: 24px; }
    }
    @media (max-height: 500px) and (orientation: landscape) {
      body { padding-top: max(8px, env(safe-area-inset-top)); padding-bottom: max(8px, env(safe-area-inset-bottom)); row-gap: 8px; }
      .cue .title { font-size: 22px; }
      .cue { padding: 8px 12px 10px; }
      #cues { grid-auto-rows: minmax(76px, 1fr); }
      .stops { flex-basis: 72px; }
      #spotify .controls button { height: 44px; }
    }

    #editor .panel { width: 100%; height: 100%; background: #151515; display: flex; flex-direction: column;
      padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
    .ed-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid #262626; }
    .ed-head h2 { flex: 1; margin: 0; text-align: center; font-size: 17px; }
    .ed-head button { flex: none; height: 40px; padding: 0 14px; border-radius: 10px; font-size: 15px; background: #2a2a2a; }
    .ed-head .ed-save { background: #1f7a3a; }
    .ed-body { flex: 1; overflow-y: auto; padding: 12px 16px 24px; user-select: text; -webkit-user-select: text; }
    .ed-body h3 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: #888; margin: 24px 0 8px; }
    .ed-body ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .ed-err { color: #ff6b61; margin: 0; min-height: 0; }
    .ed-err:empty { display: none; }
    .ed-empty { color: #888; text-align: center; }
    .ed-list li { background: #1f1f1f; border-radius: 12px; padding: 10px; display: grid; gap: 8px;
      grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; border-left: 6px solid var(--bg); }
    .ed-list .ed-num { font-weight: 800; font-size: 18px; min-width: 2ch; }
    .ed-list .ed-qname { font-size: 13px; color: #999; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ed-list .ed-row2 { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .ed-list input[type=text] { flex: 1 1 140px; min-width: 0; font-size: 16px; padding: 8px 10px; border-radius: 8px;
      border: 1px solid #333; background: #111; color: #fff; }
    .ed-list select { font-size: 15px; padding: 8px; border-radius: 8px; border: 1px solid #333; background: #111; color: #fff; }
    .ed-list label { font-size: 13px; color: #bbb; display: flex; align-items: center; gap: 6px; }
    .ed-list .ed-moves { display: flex; gap: 4px; }
    .ed-list .ed-moves button { flex: none; width: 36px; height: 36px; border-radius: 8px; background: #2a2a2a; font-size: 15px; }
    .ed-list .ed-moves .ed-remove { background: #5a1a17; }
    .ed-qlab li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: #1b1b1b; }
    .ed-qlab li.ed-note { background: none; color: #888; justify-content: center; }
    .ed-qlab li.ed-list-name { background: none; color: #888; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; padding: 8px 0 0; }
    .ed-qlab .ed-num { font-weight: 700; min-width: 3ch; }
    .ed-qlab .ed-qname { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ed-qlab .ed-type { font-size: 11px; color: #888; }
    .ed-qlab button { flex: none; width: 40px; height: 36px; border-radius: 8px; font-size: 20px; }
    .ed-qlab li.added button, .ed-qlab li.nonum button { background: #2a2a2a; color: #777; }
    .ed-search { width: 100%; font-size: 16px; padding: 10px 12px; border-radius: 10px; border: 1px solid #333;
      background: #111; color: #fff; margin-bottom: 8px; }
  </style>
</head>
<body>
  <header><h1>QLab Remote</h1><span class="right"><span id="conn">QLab</span><button id="edit-open" aria-label="Muokkaa nappeja" hidden>⚙</button></span></header>
  <div id="banner" role="alert" hidden><strong></strong><span></span></div>
  <main id="main">
  <section id="playhead" class="empty" hidden>
    <div class="ph-info"><span class="ph-label">SEURAAVANA</span><span class="ph-num"></span><span class="ph-name">Ei cuea valmiina</span></div>
    <div class="ph-controls">
      <button data-ph="previous" aria-label="Edellinen cue">⏮</button>
      <button data-ph="go" class="ph-go">GO</button>
      <button data-ph="next" aria-label="Seuraava cue">⏭</button>
    </div>
  </section>
  <div id="cues"></div>
  </main>
  <aside id="side">
  <div class="stops">
    <button id="fade"><span>FADE</span><small>2 s</small></button>
    <button id="stop"><span>STOP</span><small>2× napautus</small></button>
  </div>
  <section id="spotify" class="off" hidden>
    <div class="top"><span class="label" aria-label="Spotify">♪</span><span class="track">Spotify ei ole käynnissä</span><span class="time"></span></div>
    <div class="artist"></div>
    <div class="progress"><div></div></div>
    <div class="controls">
      <button data-cmd="previous" aria-label="Edellinen">⏮</button>
      <button data-cmd="playpause" class="pp" aria-label="Toista/tauko">▶</button>
      <button data-cmd="next" aria-label="Seuraava">⏭</button>
    </div>
    <label class="vol">🔈<input type="range" min="0" max="100" step="1" aria-label="Äänenvoimakkuus"><span class="volnum"></span></label>
  </section>
  </aside>
  <div id="status"></div>

  <div id="editor" class="overlay" hidden>
    <div class="panel">
      <div class="ed-head">
        <button class="ed-cancel">Peruuta</button>
        <h2>Napit</h2>
        <button class="ed-save">Tallenna</button>
      </div>
      <div class="ed-body">
        <p class="ed-err" role="alert"></p>
        <ul class="ed-list"></ul>
        <p class="ed-empty">Ei nappeja. Lisää cueja alta.</p>
        <h3>Lisää QLabista</h3>
        <input class="ed-search" type="search" placeholder="Hae numerolla tai nimellä" aria-label="Hae cueja">
        <ul class="ed-qlab"><li class="ed-note">Haetaan cue-listaa…</li></ul>
      </div>
    </div>
  </div>

  <div id="sheet" class="overlay" hidden>
    <div class="panel">
      <h2></h2>
      <button data-act="pause">Tauko / jatka</button>
      <button data-act="fade">Feidaa</button>
      <button data-act="stop">Pysäytä</button>
      <button class="cancel">Peruuta</button>
    </div>
  </div>

  <div id="login" class="overlay" hidden>
    <form>
      <h2>QLab Remote</h2>
      <input type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" aria-label="PIN">
      <button type="submit">Kirjaudu</button>
      <div class="err"></div>
    </form>
  </div>

  <script>
    const $ = (sel, root = document) => root.querySelector(sel);
    const statusEl = $('#status');
    const cuesEl = $('#cues');
    const bannerEl = $('#banner');
    const connEl = $('#conn');
    const fadeBtn = $('#fade');
    const stopBtn = $('#stop');
    const playheadEl = $('#playhead');
    const sheetEl = $('#sheet');
    const cueButtons = {};
    let config = null;
    let lastStatus = null;

    const now = () => new Date().toLocaleTimeString('fi-FI');

    // QLab names cues after their media file by default; the extension is just noise on a button.
    const displayName = name => (name || '').replace(/\.(wav|mp3|aiff?|m4a|aac|flac|ogg|mov|mp4|m4v|png|jpe?g|gif)$/i, '');

    function fmt(sec) {
      sec = Math.max(0, Math.round(sec));
      return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
    }

    // Sends a QLab command. The server only answers once QLab has confirmed it, so the button
    // stays in a "pending" state until then and turns green (ok) or red (error).
    async function qlabCommand(url, btn, label, vibration) {
      if (btn.classList.contains('pending')) return false;
      btn.classList.remove('ok', 'err');
      btn.classList.add('pending');
      let ok = false;
      try {
        const res = await fetch(url, { method: 'POST' });
        if (res.status === 401) { showLogin(); return false; }
        if (!res.ok) throw new Error(await res.text() || res.statusText);
        btn.classList.add('ok');
        statusEl.textContent = label + ' – ' + now();
        if (navigator.vibrate) navigator.vibrate(vibration);
        ok = true;
      } catch (e) {
        btn.classList.add('err');
        statusEl.textContent = label + ' epäonnistui: ' + (e.message === 'Failed to fetch' ? 'ei yhteyttä palvelimeen' : e.message);
        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      } finally {
        btn.classList.remove('pending');
        setTimeout(() => btn.classList.remove('ok', 'err'), btn.classList.contains('err') ? 1500 : 400);
      }
      return ok;
    }

    // Runs action only on the second tap within DOUBLE_TAP_MS, so the button can't be hit by accident.
    const DOUBLE_TAP_MS = 500;
    function doubleTap(btn, action) {
      let armTimer = null;
      btn.addEventListener('click', () => {
        if (!armTimer) {
          btn.classList.add('armed');
          armTimer = setTimeout(() => { armTimer = null; btn.classList.remove('armed'); }, DOUBLE_TAP_MS);
          return;
        }
        clearTimeout(armTimer);
        armTimer = null;
        btn.classList.remove('armed');
        action();
      });
    }

    // Calls onLongPress after LONG_PRESS_MS of holding, and swallows the click that follows,
    // so a long press on a cue never also fires its GO.
    const LONG_PRESS_MS = 500;
    function longPress(btn, onLongPress) {
      let timer = null;
      let fired = false;
      const cancel = () => { clearTimeout(timer); timer = null; };
      btn.addEventListener('pointerdown', () => {
        fired = false;
        timer = setTimeout(() => {
          fired = true;
          if (navigator.vibrate) navigator.vibrate(15);
          onLongPress();
        }, LONG_PRESS_MS);
      });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => btn.addEventListener(ev, cancel));
      btn.addEventListener('contextmenu', e => e.preventDefault());
      btn.addEventListener('click', e => {
        if (fired) { e.stopImmediatePropagation(); fired = false; }
      }, true);
    }

    // --- Per-cue menu ---
    let sheetCue = null;
    function openSheet(cue) {
      sheetCue = cue;
      const s = lastStatus?.cues?.[cue.number];
      $('h2', sheetEl).textContent = 'Cue ' + cue.number + (cue.label ? ' · ' + cue.label : '') + (s?.name ? ' – ' + s.name : '');
      $('[data-act="fade"]', sheetEl).textContent = 'Feidaa (' + config.fadeSeconds + ' s)';
      sheetEl.hidden = false;
    }
    function closeSheet() { sheetEl.hidden = true; sheetCue = null; }
    sheetEl.addEventListener('click', e => { if (e.target === sheetEl) closeSheet(); });
    $('.cancel', sheetEl).addEventListener('click', closeSheet);
    const SHEET_LABELS = { pause: 'Tauko/jatka', fade: 'FADE', stop: 'STOP' };
    sheetEl.querySelectorAll('[data-act]').forEach(btn => btn.addEventListener('click', async () => {
      const cue = sheetCue;
      const act = btn.dataset.act;
      if (await qlabCommand('/cue/' + encodeURIComponent(cue.number) + '/' + act, btn, SHEET_LABELS[act] + ' cue ' + cue.number, 30)) {
        setTimeout(closeSheet, 300);
      }
    }));

    // --- Spotify ---
    const sp = $('#spotify');
    const volInput = $('input[type=range]', sp);
    let volDragging = false;
    let volSending = false;
    let volPending = null;

    async function spotify(cmd) {
      try {
        const res = await fetch('/spotify/' + cmd, { method: 'POST' });
        if (res.status === 401) return showLogin();
        if (!res.ok) throw new Error(await res.text());
      } catch (e) {
        statusEl.textContent = 'Virhe: ' + e.message;
      }
    }

    sp.querySelectorAll('.controls button').forEach(b => b.addEventListener('click', () => spotify(b.dataset.cmd)));

    // Send volume changes while dragging, but never more than one request in flight.
    async function sendVolume(v) {
      if (volSending) { volPending = v; return; }
      volSending = true;
      await spotify('volume/' + v);
      volSending = false;
      if (volPending !== null) { const next = volPending; volPending = null; sendVolume(next); }
    }
    volInput.addEventListener('input', () => {
      $('.volnum', sp).textContent = volInput.value;
      sendVolume(volInput.value);
    });
    volInput.addEventListener('pointerdown', () => { volDragging = true; });
    volInput.addEventListener('change', () => { setTimeout(() => { volDragging = false; }, 1500); });

    function renderSpotify(s) {
      sp.classList.toggle('off', !s || !s.running);
      if (!s || !s.running) {
        $('.track', sp).textContent = 'Spotify ei ole käynnissä';
        $('.artist', sp).textContent = '';
        $('.time', sp).textContent = '';
        $('.progress div', sp).style.width = 0;
        $('.pp', sp).textContent = '▶';
        return;
      }
      $('.track', sp).textContent = s.name || '–';
      $('.artist', sp).textContent = s.artist || '';
      $('.time', sp).textContent = s.duration ? '−' + fmt(s.duration - s.position) + ' / ' + fmt(s.duration) : '';
      $('.progress div', sp).style.width = s.duration ? Math.min(100, s.position / s.duration * 100) + '%' : 0;
      $('.pp', sp).textContent = s.state === 'playing' ? '⏸' : '▶';
      if (!volDragging && !volSending) {
        volInput.value = s.volume;
        $('.volnum', sp).textContent = s.volume;
      }
    }

    // --- Status rendering ---
    // connection: 'server' (page can't reach the server) or the server's QLab state.
    const CONNECTION_TEXT = {
      server: ['EI YHTEYTTÄ PALVELIMEEN', 'Tarkista wifi ja että palvelin on käynnissä Macilla.'],
      offline: ['EI YHTEYTTÄ QLABIIN', 'Onko QLab käynnissä?'],
      noreply: ['QLAB EI VASTAA', 'Onko workspace auki ja OSC sallittu?'],
      badpass: ['QLAB HYLKÄSI PASSCODEN', 'Tarkista qlabPasscode config.jsonissa.'],
      denied: ['QLAB ESTI YHTEYDEN', 'Anna OSC-yhteydelle oikeudet tai aseta passcode.'],
    };

    function renderConnection(connection) {
      document.body.dataset.connection = connection;
      const text = CONNECTION_TEXT[connection];
      bannerEl.hidden = !text;
      if (text) {
        $('strong', bannerEl).textContent = text[0];
        $('span', bannerEl).textContent = text[1];
      }
      connEl.classList.toggle('on', connection === 'ok');
      connEl.textContent = connection === 'ok' ? 'QLab yhdistetty' : connection === 'server' ? 'Ei yhteyttä palvelimeen' : 'Ei yhteyttä QLabiin';
    }

    function renderPlayhead(p) {
      playheadEl.classList.toggle('empty', !p);
      $('.ph-num', playheadEl).textContent = p ? p.number : '';
      $('.ph-name', playheadEl).textContent = p ? (p.name || p.type) : 'Ei cuea valmiina';
    }

    function render(status) {
      lastStatus = status;
      renderConnection(status.qlab);
      if (config.spotify) renderSpotify(status.spotify);
      if (config.playhead) renderPlayhead(status.playhead);
      for (const cue of config.cues) {
        const btn = cueButtons[cue.number];
        const s = status.cues[cue.number];
        const meta = $('.meta', btn);
        const bar = $('.bar', btn);
        // Title: own label, else QLab's cue name, else just the number.
        $('.title', btn).textContent = cue.label || (s?.found && displayName(s.name)) || 'Cue ' + cue.number;
        btn.classList.toggle('running', !!(s && s.running && !s.paused));
        btn.classList.toggle('paused', !!(s && s.paused));
        const active = !!(s && (s.running || s.paused));
        bar.style.width = active && s.duration ? Math.min(100, s.elapsed / s.duration * 100) + '%' : 0;
        meta.replaceChildren();
        if (!s) continue;
        if (!s.found) { meta.append(el('span', { className: 'warn', textContent: 'Cuea ei löydy QLabista' })); continue; }
        // Idle: just the length. Playing: time left, big, then the length. Paused: same in yellow.
        if (!active) meta.append(s.duration ? fmt(s.duration) : '');
        else if (!s.duration) meta.append(el('b', { textContent: (s.paused ? '❚❚ ' : '') + fmt(s.elapsed) }));
        else meta.append(el('b', { textContent: (s.paused ? '❚❚ ' : '') + '−' + fmt(s.duration - s.elapsed) }), ' / ' + fmt(s.duration));
      }
    }

    // Status arrives over Server-Sent Events about four times a second. If nothing arrives for
    // STATUS_TIMEOUT_MS the connection counts as lost, so stale cue info never looks current.
    const STATUS_TIMEOUT_MS = 2000;
    let watchdog = null;
    function resetWatchdog() {
      clearTimeout(watchdog);
      watchdog = setTimeout(() => render({ qlab: 'server', cues: {}, playhead: null, spotify: null }), STATUS_TIMEOUT_MS);
    }

    function listen() {
      const events = new EventSource('/events');
      events.onmessage = e => { resetWatchdog(); render(JSON.parse(e.data)); };
      // Buttons were changed (possibly from another phone): rebuild by reloading, but don't
      // throw away an edit in progress here.
      events.addEventListener('config', () => {
        if (editorEl.hidden) location.reload();
        else reloadAfterEdit = true;
      });
      // EventSource reconnects by itself; a 401 (e.g. PIN changed) closes it for good.
      events.onerror = async () => {
        if (events.readyState === EventSource.CLOSED) {
          const res = await fetch('/config').catch(() => null);
          if (res?.status === 401) showLogin();
          else setTimeout(listen, 2000);
        }
      };
      resetWatchdog();
    }

    // --- Setup ---
    function buildUi() {
      for (const cue of config.cues) {
        const btn = document.createElement('button');
        btn.className = 'cue';
        btn.style.setProperty('--bg', cue.color);
        btn.append(
          el('span', { className: 'top' },
            el('span', { className: 'chip', textContent: cue.number }),
            el('span', { className: 'title', textContent: cue.label || 'Cue ' + cue.number }),
            cue.spotifyFadeOut && config.spotify ? el('span', { className: 'flag', textContent: '♪↓', title: 'Feidaa Spotifyn pois' }) : ''),
          el('span', { className: 'meta' }),
          el('span', { className: 'bar' }));
        btn.ariaLabel = 'GO ' + (cue.label || 'cue ' + cue.number);
        btn.addEventListener('click', () => qlabCommand('/go/' + encodeURIComponent(cue.number), btn, 'GO cue ' + cue.number, 30));
        longPress(btn, () => openSheet(cue));
        cuesEl.appendChild(btn);
        cueButtons[cue.number] = btn;
      }
      cuesEl.hidden = !config.cues.length;

      playheadEl.hidden = !config.playhead;
      playheadEl.classList.toggle('solo', !config.cues.length);
      playheadEl.querySelectorAll('[data-ph]').forEach(btn => btn.addEventListener('click', () => {
        const ph = btn.dataset.ph;
        qlabCommand('/playhead/' + ph, btn, ph === 'go' ? 'GO ' + $('.ph-num', playheadEl).textContent : 'Playhead ' + (ph === 'next' ? 'alas' : 'ylös'), 30);
      }));

      sp.hidden = !config.spotify;
      $('#edit-open').hidden = !config.cuesEditable;

      const fade = () => qlabCommand('/fade', fadeBtn, 'FADE', 30);
      $('small', fadeBtn).textContent = config.fadeSeconds + ' s' + (config.fadeConfirm ? ' · 2× napautus' : '');
      if (config.fadeConfirm) doubleTap(fadeBtn, fade);
      else fadeBtn.addEventListener('click', fade);
      doubleTap(stopBtn, () => qlabCommand('/stop', stopBtn, 'STOP', [30, 50, 30]));
    }

    // --- Cue editor ---
    const editorEl = $('#editor');
    const COLOR_LABELS = { green: 'Vihreä', blue: 'Sininen', purple: 'Violetti', orange: 'Oranssi', red: 'Punainen', teal: 'Turkoosi', gray: 'Harmaa' };
    let draft = [];
    let qlabRows = null;
    let reloadAfterEdit = false;

    // Builds an element; children may be nodes or strings (always inserted as text, never HTML,
    // since cue names come from the QLab workspace).
    function el(tag, props = {}, ...children) {
      const node = Object.assign(document.createElement(tag), props);
      for (const child of children) if (child != null) node.append(child);
      return node;
    }

    function qlabName(number) {
      return qlabRows?.find(r => r.number === number)?.name || lastStatus?.cues?.[number]?.name || '';
    }

    function openEditor() {
      draft = config.cues.map(c => ({ ...c }));
      $('.ed-err', editorEl).textContent = '';
      $('.ed-search', editorEl).value = '';
      editorEl.hidden = false;
      renderDraft();
      loadQlabCues();
    }

    function closeEditor() {
      editorEl.hidden = true;
      if (reloadAfterEdit) location.reload();
    }

    function renderDraft() {
      const list = $('.ed-list', editorEl);
      list.replaceChildren();
      $('.ed-empty', editorEl).hidden = draft.length > 0;
      draft.forEach((cue, i) => {
        const move = (delta) => {
          const j = i + delta;
          if (j < 0 || j >= draft.length) return;
          [draft[i], draft[j]] = [draft[j], draft[i]];
          renderDraft();
        };
        const colorSelect = el('select', { ariaLabel: 'Väri' });
        for (const [name, hex] of Object.entries(config.colors)) colorSelect.append(el('option', { value: hex, textContent: COLOR_LABELS[name] || name }));
        if (!Object.values(config.colors).includes(cue.color)) colorSelect.append(el('option', { value: cue.color, textContent: 'Oma ' + cue.color }));
        colorSelect.value = cue.color;

        const li = el('li', {},
          el('span', { className: 'ed-num', textContent: cue.number }),
          el('span', { className: 'ed-qname', textContent: qlabName(cue.number) }),
          el('span', { className: 'ed-moves' },
            el('button', { textContent: '↑', ariaLabel: 'Siirrä ylös', disabled: i === 0, onclick: () => move(-1) }),
            el('button', { textContent: '↓', ariaLabel: 'Siirrä alas', disabled: i === draft.length - 1, onclick: () => move(1) }),
            el('button', { className: 'ed-remove', textContent: '✕', ariaLabel: 'Poista', onclick: () => { draft.splice(i, 1); renderDraft(); renderQlabRows(); } })),
          el('div', { className: 'ed-row2' },
            el('input', { type: 'text', value: cue.label, placeholder: 'Napin teksti (valinnainen)', maxLength: 40, oninput: e => { cue.label = e.target.value; } }),
            colorSelect,
            config.spotify ? el('label', {}, el('input', { type: 'checkbox', checked: cue.spotifyFadeOut, onchange: e => { cue.spotifyFadeOut = e.target.checked; } }), '♪ musiikki alas') : null));
        li.style.setProperty('--bg', cue.color);
        colorSelect.onchange = () => { cue.color = colorSelect.value; li.style.setProperty('--bg', cue.color); };
        list.append(li);
      });
    }

    async function loadQlabCues() {
      const list = $('.ed-qlab', editorEl);
      list.replaceChildren(el('li', { className: 'ed-note', textContent: 'Haetaan cue-listaa…' }));
      try {
        const res = await fetch('/qlab/cues');
        if (!res.ok) throw new Error(await res.text());
        qlabRows = await res.json();
      } catch (e) {
        qlabRows = null;
        list.replaceChildren(el('li', { className: 'ed-note', textContent: 'Cue-listaa ei saatu: ' + e.message }));
        return;
      }
      renderDraft(); // QLab names are now known
      renderQlabRows();
    }

    function renderQlabRows() {
      if (!qlabRows) return;
      const list = $('.ed-qlab', editorEl);
      const q = $('.ed-search', editorEl).value.trim().toLowerCase();
      const rows = qlabRows.filter(r => !q || r.number.toLowerCase().includes(q) || r.name.toLowerCase().includes(q));
      const showLists = new Set(qlabRows.map(r => r.list)).size > 1;
      list.replaceChildren();
      let currentList = null;
      for (const r of rows) {
        if (showLists && r.list !== currentList) {
          currentList = r.list;
          list.append(el('li', { className: 'ed-list-name', textContent: r.list }));
        }
        const added = draft.some(c => c.number === r.number);
        const li = el('li', { className: !r.number ? 'nonum' : added ? 'added' : '' },
          el('span', { className: 'ed-num', textContent: r.number || '–' }),
          el('span', { className: 'ed-qname', textContent: r.name || '(nimetön)' }),
          el('span', { className: 'ed-type', textContent: r.type }));
        li.style.paddingLeft = (12 + r.depth * 16) + 'px';
        const btn = el('button', { textContent: !r.number ? '–' : added ? '✓' : '+' });
        if (!r.number) {
          btn.disabled = true;
          btn.title = 'Cuella ei ole numeroa. Anna sille numero QLabissa.';
        } else {
          btn.ariaLabel = added ? 'Poista napeista' : 'Lisää napiksi';
          btn.onclick = () => {
            if (added) draft = draft.filter(c => c.number !== r.number);
            else draft.push({ number: r.number, label: '', color: config.colors.green, spotifyFadeOut: false });
            renderDraft();
            renderQlabRows();
          };
        }
        li.append(btn);
        list.append(li);
      }
      if (!rows.length) list.append(el('li', { className: 'ed-note', textContent: q ? 'Ei osumia' : 'Workspacessa ei ole cueja' }));
    }

    $('.ed-search', editorEl).addEventListener('input', renderQlabRows);
    $('.ed-cancel', editorEl).addEventListener('click', closeEditor);
    $('#edit-open').addEventListener('click', openEditor);
    $('.ed-save', editorEl).addEventListener('click', async () => {
      const err = $('.ed-err', editorEl);
      err.textContent = '';
      try {
        const res = await fetch('/config/cues', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(draft) });
        if (res.status === 401) return showLogin();
        if (!res.ok) throw new Error(await res.text());
        location.reload();
      } catch (e) {
        err.textContent = 'Tallennus epäonnistui: ' + (e.message === 'Failed to fetch' ? 'ei yhteyttä palvelimeen' : e.message);
      }
    });

    function showLogin() {
      const login = $('#login');
      login.hidden = false;
      $('input', login).focus();
    }

    $('#login form').addEventListener('submit', async e => {
      e.preventDefault();
      const input = $('#login input');
      const err = $('#login .err');
      err.textContent = '';
      const res = await fetch('/login', { method: 'POST', body: input.value }).catch(() => null);
      if (res?.ok) location.reload();
      else { err.textContent = res ? 'Väärä PIN' : 'Ei yhteyttä palvelimeen'; input.value = ''; }
    });

    async function init() {
      try {
        const res = await fetch('/config');
        if (res.status === 401) return showLogin();
        config = await res.json();
      } catch {
        renderConnection('server');
        return setTimeout(init, 2000);
      }
      buildUi();
      listen();
    }
    init();
  </script>
</body>
</html>
